name: IADD.PO carry lavapipe evidence
on:
  push:
    branches: [codex/shader-iadd-po-carry-final-check]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Prepare the repository's pinned Vulkan image
        run: docker build --platform linux/amd64 -t s2arm-iadd-po-test tests/vulkan
      - name: Run the same synthetic suite on the baseline and proposed change
        shell: bash
        run: |
          set -euo pipefail
          change=$(git rev-parse HEAD^)
          base=$(git rev-parse HEAD^^)
          git worktree add --detach "$RUNNER_TEMP/change" "$change"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          out="$RUNNER_TEMP/shader-evidence"
          mkdir -p "$out"
          run_variant() {
            local variant=$1
            docker run --rm --network none --user "$(id -u):$(id -g)" \
              -v "$RUNNER_TEMP/$variant:/src:ro" -v "$out:/out" \
              -e S2A_TEST_SOURCE_HEAD="$2" -e S2A_VULKAN_CACHE=off \
              -e SHADER_CASES_OUT="/out/$variant" \
              s2arm-iadd-po-test tests/shader_cases_test.sh
          }
          baseline_rc=0
          run_variant base "$base" || baseline_rc=$?
          candidate_rc=0
          run_variant change "$change" || candidate_rc=$?
          printf 'baseline %s exit %s\nchange %s exit %s\n' "$base" "$baseline_rc" "$change" "$candidate_rc"
          python3 - "$out" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          for variant in ("base", "change"):
              report = root / variant / "coverage.json"
              if report.is_file():
                  patches = json.loads(report.read_text())["patches"]
                  print(f"{variant} patches: {patches['count']}/{patches['total']}")
                  print(json.dumps(patches.get("evidence", {}), ensure_ascii=False, indent=2))
              build_log = root / variant / "build.log"
              if not report.is_file() and build_log.is_file():
                  print(build_log.read_text()[-12000:])
          carry = root / "change" / "iadd-po-carry-proof.json"
          if carry.is_file():
              print("IADD.PO carry evidence:")
              print(carry.read_text())
          PY
          test "$baseline_rc" -eq 0
          test "$candidate_rc" -eq 0
          test -f "$out/change/iadd-po-carry-proof.json"
  contributor-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 34d7b4259d19f67b37f6396b4772a18f7021b8a3
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: compat/tree/global.json
      - name: Prepare public contributor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            glslc spirv-tools libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers
          python3 -m pip install -r tools/rewriter-requirements.txt -r launchers/macos/requirements-runtime.txt
          python3 runtime/rewriter/prepare_deps.py build/rewriter-deps
      - name: Run the contributor self-check
        shell: bash
        env:
          CONTRIB_BASE_RERUN: '1'
          S2A_VULKAN_CACHE: 'off'
          LP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          export DOTNET="$(command -v dotnet)"
          icd=
          for f in /usr/share/vulkan/icd.d/lvp_icd.json /usr/share/vulkan/icd.d/lvp_icd.*.json; do
            if [ -f "$f" ]; then icd=$f; break; fi
          done
          test -n "$icd"
          export VK_DRIVER_FILES="$icd" S2A_LAVAPIPE_ICD="$icd"
          export VK_LAYER_PATH=/usr/share/vulkan/explicit_layer.d
          export S2A_VK_LAYER_DIR="$VK_LAYER_PATH" VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation VK_LAYER_VALIDATE_SYNC=1
          git update-ref refs/remotes/origin/main "$(git rev-parse HEAD^)"
          rc=0
          bash tools/contrib_check.sh --base origin/main || rc=$?
          if [ -f build/contrib_check/summary.md ]; then
            cat build/contrib_check/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$rc" -ne 0 ] && [ -f build/contrib_check/gate.log ]; then
            rg -n -C 3 '^🔴 ' build/contrib_check/gate.log || true
          fi
          printf 'contrib_check Linux exit %s\n' "$rc"
          exit "$rc"
